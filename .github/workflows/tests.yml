name: tests

# 这是本项目唯一能长期生效的质量闸门。
# 之所以加它：插件曾在"365 个测试全部通过"的情况下静默降级数个版本——
# 因为那批测试没有一个导入 main.py，initialize() 里的属性错误无人发现。
# 现在 tests/test_plugin_wiring.py（启动冒烟）与 tests/test_symbol_refs.py（属性检查）
# 会在每次推送时真实跑一遍启动流程与属性存在性检查。
#
# 注意：测试不需要安装 AstrBot —— main.py 的依赖由测试内的最小桩模块提供。

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pytest pytest-asyncio

      - name: Run tests
        run: python -m pytest -q
